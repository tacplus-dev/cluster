#
# The .gitlab-ci.yml of the GitLab project gitlab.com/tacplus-dev/cluster, kept here
# (github.com/tacplus-dev/cluster ci/gitlab-project.gitlab-ci.yml) and copied into that project with CLUSTER_COMMIT
# set, and nothing else changed: `ci/pin.sh <commit>` prints it, and the render job refuses a copy that differs
# (the fleet-seatrials pattern; tacplus-dev/roadmap decisions/cluster-pipeline-2026-11-02.md). Every job checks
# this repository out at that commit: it is public, so with no credential. Runbook: README.
#
#   render             the tools (ci/tools.sh), the copy checked (ci/pin.sh --check), ./render.sh into out/
#   validate           kubeconform and ci/policy.sh on out/, deploymentproxy's release and GitLab Runner's chart
#                      checked, the tests (ci/checks.sh)
#   security           OSV-Scanner on the tree, govulncheck on the pinned tools, gitleaks on the tree and its history,
#                      Trivy on the CI image and the pinned images it deploys, security-exceptions.yaml enforced
#                      (ci/security.sh); plan waits for it
#   plan               main: kubectl diff against the cluster dev, and what each deployment gains or loses
#   apply              main, automatically once plan succeeds (main is not production: nothing waits for a person),
#                      the render plan saved, then the in-cluster runners' tokens from Secret Manager by version, in
#                      the protected environment cluster: never deletes; not in a deletion pipeline
#   DELETE deployment  a deletion pipeline only, manual, in the protected environment cluster: deletes the
#                      deployment DELETE_DEPLOYMENT
#   drift              the nightly schedule: plan, and an issue on github.com/tacplus-dev/cluster if it differs; never applies
#
# render, validate and security run on every push and merge request, and nightly. The cluster jobs run on main only,
# where Workload Identity Federation admits this project (its provider's condition: protected main) as
# cluster-admin-pipeline, the only holder of cluster-admin on dev. No key file and no GitHub token is stored:
# the id_token is exchanged for each job. The only pipeline variables are a deletion pipeline's: DELETE_DEPLOYMENT
# and DELETE_CONFIRM, both the deployment's name, set when Jody runs the pipeline on main from the web form or the
# API (README, Deleting a deployment); no other pipeline has the deletion job. Every job runs on the project's own
# runner (tag `cluster`: a VM used once, with no Google account of its own), never on the agents' runner.
stages: [render, validate, plan, apply]

variables:
  # The commit of github.com/tacplus-dev/cluster this pipeline renders and applies; empty in the repository,
  # set in the GitLab project's copy (ci/pin.sh).
  CLUSTER_COMMIT: ""
  # The cluster: tacplus-dev/cloud's dev, in the project tacplus-dev (seabeam.net; #7).
  GCP_PROJECT: tacplus-dev
  GCP_DEPLOY_SA: cluster-admin-pipeline@tacplus-dev.iam.gserviceaccount.com
  CLUSTER: dev
  ZONE: us-central1-a
  # The tacplus-reader app's key, in Cloud KMS (github_app_token in ci/lib.sh): the drift job files its issue with it.
  TACPLUS_READER_KMS_KEY: projects/jody1-328023/locations/us/keyRings/looper/cryptoKeys/tacplus-reader

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web|api|schedule)$/

default:
  image: ghcr.io/tacplus-dev/tacplus/build:2.6
  tags: [cluster]
  interruptible: false
  before_script:
    # This repository at CLUSTER_COMMIT, in src/ (where the render job's bin/ and out/ artifacts land).
    - |
      set -euo pipefail
      [[ "$CLUSTER_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
        { echo "CLUSTER_COMMIT is not a full commit hash: [$CLUSTER_COMMIT]: the project's .gitlab-ci.yml is made with ci/pin.sh <commit> (README)" >&2; exit 1; }
      git init -q src
      git -C src fetch -q --depth 1 https://github.com/tacplus-dev/cluster.git "$CLUSTER_COMMIT"
      git -C src checkout -q FETCH_HEAD
      echo "tacplus-dev/cluster at $CLUSTER_COMMIT: $(git -C src log -1 --format=%s)"

# The jobs that reach the cluster: main only, never from a merge request, and each with its id_token.
.cluster:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER

render:
  stage: render
  needs: []
  script:
    - |
      cd src
      ci/pin.sh --check "$CI_PROJECT_DIR/.gitlab-ci.yml"
      ci/tools.sh
      PATH=$PWD/bin:$PATH ./render.sh deployments.yaml out
  artifacts:
    paths: [src/bin/, src/out/]
    expire_in: 1 week

validate:
  stage: validate
  needs: [render]
  script:
    - cd src && export PATH=$PWD/bin:$PATH && ci/validate.sh out && ci/checks.sh

# The security checks (ci/security.sh): in every pipeline, so on every push and merge request and on the nightly
# schedule. They fail on any secret, and on a HIGH or CRITICAL finding with a fix that no unexpired entry of
# security-exceptions.yaml accepts; plan, and so apply, waits for them. Their JSON report is the job's artifact,
# kept whether it passes or fails. The history is fetched in full for gitleaks; no credential is in this job.
security:
  stage: validate
  needs: []
  script:
    - |
      cd src
      git fetch -q --unshallow https://github.com/tacplus-dev/cluster.git "$CLUSTER_COMMIT"
      ci/tools.sh security
      PATH=$PWD/bin:$PATH ci/security.sh . "$CI_JOB_IMAGE" bin/*
  artifacts:
    when: always
    paths: [src/security/]
    expire_in: 30 days

plan:
  extends: .cluster
  stage: plan
  needs: [render, validate, { job: security, artifacts: false }]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/
  script:
    - cd src && export PATH=$PWD/bin:$PATH && source ci/lib.sh && ci_gcp && ci_kube && PLAN_SUMMARY=plan.txt ci/plan.sh out
  # The render it diffed, with the tools, and its summary: what apply applies.
  artifacts:
    paths: [src/bin/, src/out/, src/plan.txt]
    expire_in: 1 week

# The apply: automatic on main once plan succeeds, with no manual gate: this cluster is not production, and outside
# production nothing waits for a person (tacplus-dev/roadmap decisions/deterministic-deployments-2026-11-02.md,
# addendum). The production cluster has its own pipeline, with Jody's manual apply (PRODUCTION.md). It applies the
# render plan saved, after planning it again on the cluster as it is now; it never deletes; a failure fails the
# pipeline. A deletion pipeline has no apply, so that the two are never side by side.
apply:
  extends: .cluster
  stage: apply
  needs: [plan]
  rules:
    - if: $DELETE_DEPLOYMENT
      when: never
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/
  environment: { name: cluster, action: start }
  resource_group: cluster
  script:
    - cd src && export PATH=$PWD/bin:$PATH && source ci/lib.sh && ci_gcp && ci_kube && ci/apply.sh out

# Deletes one deployment's namespaces, and its tenants' data with them. Only in a deletion pipeline: on main, run
# from the web form or the API with DELETE_DEPLOYMENT set to the deployment and DELETE_CONFIRM to the same name
# (README, Deleting a deployment); a push, merge request or schedule pipeline never has it. Manual, in the protected
# environment cluster (Jody only). ci/delete-deployment.sh checks both variables again, and refuses a deployment
# deployments.yaml still lists.
"DELETE deployment: removes tac-<DELETE_DEPLOYMENT> and every tenant namespace (data loss)":
  extends: .cluster
  stage: apply
  needs: [render, validate]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $DELETE_DEPLOYMENT && $DELETE_CONFIRM == $DELETE_DEPLOYMENT
      when: manual
  allow_failure: true
  environment: { name: cluster, action: start }
  resource_group: cluster
  script:
    - cd src && export PATH=$PWD/bin:$PATH && source ci/lib.sh && ci_gcp && ci_kube && ci/delete-deployment.sh deployments.yaml

# The nightly drift check: the plan, and an issue here when it differs. It never applies.
drift:
  extends: .cluster
  stage: plan
  needs: [render, validate]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cd src && export PATH=$PWD/bin:$PATH && source ci/lib.sh && ci_gcp && ci_kube && ci/drift.sh out
