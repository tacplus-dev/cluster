# GitLab Runner's chart and images, which the in-cluster CI runs (README, CI in the cluster). Each image by tag and
# digest, the chart by its version and the SHA-256 of its archive (the digest of charts.gitlab.io's index):
# nothing here resolves a moving tag or "latest". gitlab-runner/fetch.sh fetches the chart into release/ and checks
# all of it; render.sh renders the chart with these images.
#
# A bump: a release of the chart and its appVersion's images, all four lines changed together, then
# gitlab-runner/fetch.sh (which refuses a digest that is not the tag's) and UPDATE=1 tests/render_test.sh for the
# render fixture. Review the diff of release/ in the pull request.
chart:
  name: gitlab-runner
  version: 0.94.2
  url: https://gitlab-charts.s3.amazonaws.com/gitlab-runner-0.94.2.tgz
  index: https://charts.gitlab.io/index.yaml
  digest: sha256:6a63ce370db021252f4f6f0414a4ff1fb09f8105d683dd8539ee670263944f21
# The runner manager (the chart's Deployment): the chart's appVersion, its alpine variant.
runner: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.5.2@sha256:800157105b792ed3f0c9bc0aa6bc6427d66889cafd2c8aae4c4c177194699144
# The helper container of every job pod (clones, caches, artifacts), the same version.
helper: registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:v19.5.2@sha256:ae5b88412762e33a2a1ad4c5bb81b6eec75b638088207299a681ead573e093f1
# A job's image when its job names none: the tacplus build image the pipelines already run.
job: ghcr.io/tacplus-dev/tacplus/build:2.5.11@sha256:82154c0263fb66e0b6533672a677d0c7a930b2883879a9191c84631cc0d4ce12
