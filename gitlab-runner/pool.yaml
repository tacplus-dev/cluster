# The normal pool, and the looper pool its overflow scales up, as the runners' concurrency counts them (#36, #47):
# render.sh gives the runner whose file says `concurrent: pool` (control) as many jobs as the pools have room for, by their pods' requests, once it has counted this
# reserve, every runner manager (gitlab-runner/values.yaml's resources), deploymentproxy (its release's requests)
# and every other normal-pool runner's jobs at its full concurrent (infra's, kick's, build-light's; manager's, which
# overflow onto the looper pool, #60); and it refuses runners the pools cannot hold. A job's pod counts as its runner's default requests, the job's container and the helper's: a job raising its
# own (KUBERNETES_CPU_REQUEST) is not counted, so a runner's defaults are its largest kind's (control: a report's,
# tacplus-dev/looper#165). Bin-packing is not counted: the jobs' pods are small beside a node. Its jobs, which alone
# with manager's tolerate the looper pool's taint and prefer the normal pool, fill the normal nodes first; the rest pend, and the
# cluster autoscaler adds looper nodes for them, up to its max, and removes them once they are empty: so the looper
# pool counts at its max nodes, less only each node's daemonsets, and only for a runner whose jobs tolerate its taint.
#
#   nodes        the pool's nodes: tacplus-dev/cloud's stacks/dev, cluster.normal (3 x c4a-standard-2, fixed, no
#                autoscaling)
#   allocatable  a node's, by GKE's reservations for a c4a-standard-2 (2 vCPU, 8 GiB): CPU 2000m - 6% of the first
#                core - 1% of the second = 1930m; memory 8Gi - 25% of the first 4Gi - 20% of the next 4Gi - 100Mi
#                eviction = 6249Mi, taken as 6Gi
#   reserved     the whole pool's, for what is neither a runner nor deploymentproxy: kube-system and the deployments'
#                pods. CPU from tacplus-dev/looper#165's evidence (2026-11-16): 8 control jobs ran (a report 550m with
#                its helper, a manager 300m) beside the managers and deploymentproxy, and the next found no room
#                (`3 Insufficient cpu`), which leaves at most about 1200m of the three nodes' 5790m to the rest; memory
#                an estimate, unmeasured. The nodes' requests as measured (`kubectl describe nodes`, Allocated
#                resources) correct both (PROPOSALS.md).
nodes: 3
allocatable:
  cpu: 1930m
  memory: 6Gi
reserved:
  cpu: 1200m
  memory: 3Gi
#
#   looper       the looper pool (tacplus-dev/cloud#95; tacplus-dev/roadmap decisions/cluster-node-pools-2026-11-03.md,
#                addendum 2026-11-22): tacplus-dev/cloud's stacks/dev, cluster.looper (c4a-standard-2, on demand,
#                autoscaling 0 to max_nodes, label looper=true, taint looper=true:NoSchedule); a larger max_nodes is
#                Jody's yes there first, then here. Its allocatable is a c4a-standard-2's, as above; daemonsets what
#                each node runs before any job (GKE's kube-system DaemonSets: logging, metrics, the CSI driver,
#                Dataplane V2, the metadata server), an estimate, unmeasured: the normal pool's whole reserve per node
#                (1200m / 3, 3Gi / 3), which holds kube-system's Deployments too, bounds it from above (PROPOSALS.md).
looper:
  max_nodes: 2
  allocatable:
    cpu: 1930m
    memory: 6Gi
  daemonsets:
    cpu: 400m
    memory: 1Gi
#
# The looper's managers (#53's reserve here of 4 x 250m, until #60) are the manager runner's jobs
# (gitlab-runner/runners/manager.yaml): a fixed concurrent whose jobs tolerate the looper pool's taint and prefer the
# normal pool, so render.sh counts them before control's, in the normal pool's room first and the rest in the looper
# pool's at its max nodes, says in the render how many the normal pool holds, and refuses a count the two cannot hold.
