# The normal pool, as the runners' concurrency counts it (#36): render.sh gives the runner whose file says
# `concurrent: pool` (control) as many jobs as the pool has room for, by their pods' requests, once it has counted this
# reserve, every runner manager (gitlab-runner/values.yaml's resources), deploymentproxy (its release's requests)
# and every other normal-pool runner's jobs at its full concurrent (infra's and kick's); and it refuses runners the pool cannot
# hold. A job's pod counts as its runner's default requests, the job's container and the helper's: a job raising its
# own (KUBERNETES_CPU_REQUEST) is not counted, so a runner's defaults are its largest kind's (control: a report's,
# tacplus-dev/looper#165). Bin-packing is not counted: the jobs' pods are small beside a node. There is no other pool
# for its jobs to overflow onto: the looper pool is gone (#64; tacplus-dev/cloud#114), and render.sh refuses a
# `looper:` block here.
#
#   nodes        the pool's nodes: tacplus-dev/cloud's stacks/dev, cluster.normal (3 x c4a-standard-2, fixed, no
#                autoscaling)
#   allocatable  a node's, by GKE's reservations for a c4a-standard-2 (2 vCPU, 8 GiB): CPU 2000m - 6% of the first
#                core - 1% of the second = 1930m; memory 8Gi - 25% of the first 4Gi - 20% of the next 4Gi - 100Mi
#                eviction = 6249Mi, taken as 6Gi
#   reserved     the whole pool's, for what is neither a runner nor deploymentproxy: kube-system and the deployments'
#                pods. CPU from tacplus-dev/looper#165's evidence (2026-11-16): 8 control jobs ran (a report 550m with
#                its helper, a manager 300m) beside the managers and deploymentproxy, and the next found no room
#                (`3 Insufficient cpu`), which leaves at most about 1200m of the three nodes' 5790m to the rest; memory
#                an estimate, unmeasured. The nodes' requests as measured (`kubectl describe nodes`, Allocated
#                resources) correct both (PROPOSALS.md).
nodes: 3
allocatable:
  cpu: 1930m
  memory: 6Gi
reserved:
  cpu: 1200m
  memory: 3Gi
#
#   managers     the looper's managers (#53): control's jobs, but each at its own requests, above control's defaults
#                (a report's), which count its slots; count of them at once, held in the pool's room before control's
#                slots (tacplus-dev/looper#229, looper-dispatch: a manager asks 250m and 256Mi, above the recap's p90 of
#                210m on 2026-11-23, tacplus-dev/roadmap suggestions/recap/2026-11-23.md). Without it, none.
managers:
  count: 4
  cpu: 250m
  memory: 256Mi
