# The chart's values every runner shares (render.sh: helm template with this file, then the runner's own file in
# gitlab-runner/runners/, then the pinned images and the token's Secret). The runner manager, one Deployment per
# runner in the namespace ci: on the normal pool (arm64, never a spot node), non-root, no privilege, its service
# account allowed only what the Kubernetes executor needs in ci (a Role, never a ClusterRole), no `*`.
gitlabUrl: https://gitlab.com/
checkInterval: 3
logLevel: info
unregisterRunners: true
# A stopping manager waits for its running jobs (its pods are the jobs' executors).
terminationGracePeriodSeconds: 3600
rbac:
  create: true
  clusterWideAccess: false
  # GitLab's list for the Kubernetes executor (docs/executors/kubernetes, Configure runner API permissions), without
  # its optional features (no autoscaler, no namespace per job, no suspendable environments), every verb named.
  rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [create, delete, get, list, watch]
    - apiGroups: [""]
      resources: [pods/attach, pods/exec]
      verbs: [create, delete, get, patch]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get, list]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [create, delete, get, update]
    - apiGroups: [""]
      resources: [serviceaccounts]
      verbs: [get]
    - apiGroups: [""]
      resources: [services]
      verbs: [create, get]
    - apiGroups: [""]
      resources: [events]
      verbs: [list, watch]
serviceAccount:
  create: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  fsGroup: 65533
  seccompProfile:
    type: RuntimeDefault
# A read-only root filesystem (#29): GitLab Runner writes its config, /home/gitlab-runner/.gitlab-runner (the
# chart's emptyDir etc-gitlab-runner), its home, /home/gitlab-runner (its --working-directory), and /tmp, where it
# buffers each job's log before the job starts (#37: without it every job failed at once with runner_system_failure
# and an empty log), the emptyDirs below; fsGroup makes them writable by its uid. ci/policy.sh refuses a render
# without them (RUNNER_WRITES).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: ["ALL"]
volumes:
  - name: home
    emptyDir: {}
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: home
    mountPath: /home/gitlab-runner
  - name: tmp
    mountPath: /tmp
# The runner's own container (its jobs' are each runner's config): a CPU limit too (#34: KSV-0011), as deploymentproxy's.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
# The runner managers first (#39): a manager that cannot schedule takes its whole runner down, so each runs at the
# PriorityClass ci-runner-manager (render.sh renders it in 20-ci.yaml), above the jobs' pods, which set none, and
# preempting one when there is no room for it: during a rollout, when the old manager's jobs still run beside the new
# one's, or after a bad pack. A manager is counted in the pool's room (gitlab-runner/pool.yaml), so it takes back only
# what it is owed; the job it evicts fails and is retried.
priorityClassName: ci-runner-manager
# The normal pool: arm64 (GKE taints Arm nodes kubernetes.io/arch=arm64:NoSchedule), and never a spot node, by its
# label or GKE's.
nodeSelector:
  kubernetes.io/arch: arm64
tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: spot
              operator: NotIn
              values: ["true"]
            - key: cloud.google.com/gke-spot
              operator: NotIn
              values: ["true"]
