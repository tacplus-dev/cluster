    reason: "Trivy's ConfigMap with secrets, a false positive on GitLab Runner chart 0.94.3's entrypoint ConfigMap (gitlab-runner/release/templates/configmap.yaml, rendered in out/20-ci.yaml): its script names the files under /secrets it reads and the variables it exports from them (CI_SERVER_TOKEN, CACHE_S3_SECRET_KEY), and holds no secret; the tokens come from Secret Manager at apply time (ci/runner-tokens.sh) into a Secret projected on /secrets, and gitleaks finds nothing in the tree or its history. Upstream's script, the chart pinned by archive digest: not edited here. Trivy finds it in the render (its fixture, the four runners' ConfigMaps), not in the template: re-check it when the chart is moved. The two KSV-01010 findings on the same script are in security-baseline.json."
    decided_by: "jodydadescott (tacplus-dev/cluster#30, 2026-11-17); scoped: #45"
