#
# The known vulnerabilities this repository accepts, each until its expiry and each where it is, in the form
# looper-scan reads (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD; and where,
# tacplus-dev/looper#182: a path or a path glob, matched against the finding's where without its line, or the place in
# its parentheses: a binary's name, an image). The security job (ci/security.sh) enforces it: an expired entry fails
# the pipeline, even one that accepts only CI tooling's findings, which never fail it themselves (#55). Every entry has a where (#45): one per binary, image or file its reason names, never rule-wide. Found by `govulncheck -mode=binary` (symbols
# present) in the pinned tools of ci/tools.sh, each at its latest upstream release (kubectl: the latest of the
# cluster's minor), none with the fixed version; everything else the first run found is fixed there (the Go tools
# built with the pinned toolchain, kubectl and the GKE auth plugin pinned rather than the CI image's). Track and
# bump: move each pin to the first release with the fix and remove its entries. The binaries, by pin:
#
#   kubectl v1.34.13                GO-2026-5158 6603 6610 6611 6612 6617 6629 6860 6866, 6859 (go1.26.10, #21);
#                                   5026 6974 6975 (#56)
#   gke-gcloud-auth-plugin 0.5.21   GO-2026-6860 6866, 6859 (go1.27.3, #21)
#   osv-scanner v2.7.0, trivy v0.76.2   GO-2026-6974 (otel v1.45.0, v1.46.0; #56)
#
# CI-only tooling's findings do not block (tacplus-dev/roadmap decisions/security-gates-ship-only-2026-11-23.md):
# since #55 (tacplus-dev/looper#225) the security job reports them only; before it, each with no fixed release got
# an entry for its binary alone, 14 days, naming the release it waits on (#56).
#
# The Go tools built here from source are built with the fixed modules instead (ci/tools.sh; #10, the policy of
# tacplus-dev/cloud#24): gitleaks v8.30.1 with klauspost/compress v1.20.2, andybalholm/brotli v1.2.7 and
# ulikunitz/xz v0.5.15, osv-scanner v2.7.0, crane v0.22.1 and trivy v0.76.2 (x/net v0.62.0 its own) with compress
# v1.20.2 (#23), so none of them needs an entry but otel's (#56, above). And all of them, trivy too since #21, with go1.27.4, so that
# GO-2026-6859 (net/http) is not theirs.
#
# GitLab Runner's runner and helper images are our build since #21 (ci/runner-images.sh: go1.27.4, x/net v0.62.0,
# go-jose v4.1.6, on alpine:3.24 with git 2.54.1-r0, libexpat 2.10.0-r0, miniperl 5.42.3-r0, openssh 10.3_p1-r2; no
# docker-machine), so #9's, #11's, #15's and #21's entries for upstream's images are gone. Trivy finds one thing
# in them: GO-2026-5932 (x/crypto v0.58.0, openpgp, no fixed release), in its entry.
#
# The CI image's gh (ghcr.io/tacplus-dev/tacplus/build:2.6, also gitlab-runner/pin.yaml's job:, #12) is built with
# x/net v0.62.0 since build 2.6.3 (tacplus-dev/tacplus#350), so #15's CVE-2026-78661 entry is gone (#32). Build
# 2.6's rebuild 20261123-ef62327 (#48), on current Debian 13 (trixie-security), has the fix of every HIGH Debian
# finding of 2.6.13 (krb5, linux-libc-dev, ...) and no containerd finding in docker-buildx, so the CI image's
# CVE-2026-95839 entry is gone too. Its rebuild 20261123-57a6521 (#54, the pin since), with the docker CLI on go1.27.4
# (tacplus-dev/tacplus#901), has no HIGH or CRITICAL finding with a fixed version (Trivy, linux/arm64, 2026-11-23).
#
# Trivy's config checks (looper-scan's nightly, on the tree): KSV-0109 is a false positive on GitLab Runner chart
# 0.94.3's entrypoint ConfigMap, which names the secret files it reads and holds no secret (#30); its two KSV-01010
# findings, MEDIUM, are in security-baseline.json. Re-check both when the chart is moved. KSV-0053 and KSV-0056 are
# the RBAC this repository grants by design (#28), one entry per file Trivy finds them in: the render's (its fixture,
# tests/fixtures/render/out/, the render the tree holds) and deploymentproxy's vendored ClusterRole. A grant of them in
# any other file is a new decision: its own entry. The MEDIUM KSV-0048, KSV-0049 and KSV-0113 on the same Roles are in
# security-baseline.json.
