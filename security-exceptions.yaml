  - id: CVE-2026-42496
    reason: "miniperl, CRITICAL (helper 19.5.2, miniperl 5.42.2-r1, fixed in 5.42.3-r0): the helper runs no perl here. Its entrypoint (/entrypoint under dumb-init) is bash, then the runner's generated shell and gitlab-runner-helper; the image has no perl script (only git's .sample hooks, never run) and update-ca-certificates is a binary. Only a job's own hooks:pre_get_sources_script could run perl there, and that is its author's code in its own pod, which could run anything anyway. GitLab Runner 19.5.2 is the latest release, none with it yet."
    decided_by: "jodydadescott (hub, tacplus-dev/cluster#9, 2026-11-05)"
    expires: 2026-12-05
