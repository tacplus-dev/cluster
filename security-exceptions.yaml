#
# The known vulnerabilities this repository accepts, each until its expiry, in the form looper-scan reads
# (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD). The security job
# (ci/security.sh) enforces it: an expired entry fails the pipeline. Found by `govulncheck -mode=binary` (symbols
# present) in the pinned tools of ci/tools.sh, each at its latest upstream release (kubectl: the latest of the
# cluster's minor), none with the fixed version; everything else the first run found is fixed there (the Go tools
# built with the pinned toolchain, kubectl and the GKE auth plugin pinned rather than the CI image's). Track and
# bump: move each pin to the first release with the fix and remove its entries. The binaries, by pin:
#
#   kubectl v1.34.13                GO-2026-5158 6603 6610 6611 6612 6617 6629 6860 6866, 6859 (go1.26.10, #21)
#   gke-gcloud-auth-plugin 0.5.21   GO-2026-6860 6866, 6859 (go1.27.3, #21)
#   trivy 0.76.1                    GO-2026-5932 6860 6866 6865 (#10)
#
# The Go tools built here from source are built with the fixed modules instead (ci/tools.sh; #10, the policy of
# tacplus-dev/cloud#24): gitleaks v8.30.1 with klauspost/compress v1.20.2, andybalholm/brotli v1.2.7 and
# ulikunitz/xz v0.5.15, osv-scanner v2.7.0 with compress v1.20.2, so none of them needs an entry. And all of them,
# trivy too since #21, with go1.27.4, so that GO-2026-6859 (net/http) is not theirs.
#
# GitLab Runner's runner and helper images are our build since #21 (ci/runner-images.sh: go1.27.4, x/net v0.62.0,
# go-jose v4.1.6, on alpine:3.24 with git 2.54.1-r0, libexpat 2.10.0-r0, miniperl 5.42.3-r0, openssh 10.3_p1-r2; no
# docker-machine), so #9's, #11's, #15's and #21's entries for upstream's images are gone. Trivy finds one thing
# in them: GO-2026-5932 (x/crypto v0.58.0, openpgp, no fixed release), in the entry of trivy's.
#
# And in the CI image's gh (ghcr.io/tacplus-dev/tacplus/build:2.6, also gitlab-runner/pin.yaml's job:, #12),
# CVE-2026-78661 (#15), until tacplus-dev/tacplus#350 ships a gh built with x/net v0.62.0.
# And in its Debian zlib1g and zlib1g-dev (1:1.3.dfsg+really1.3.1-1+b1, fixed in 1-1+deb13u1), CVE-2026-85091 and
# CVE-2026-76844 (#16): build:2.6.2 (since #16) has the fix on amd64 only; its arm64 image, the one the cluster runs, is
# still v2.6.1's (tacplus-dev/tacplus#369). Track: move build.lock and pin.yaml's job: to the first build:2.6.x whose
# arm64 image has it, and remove both entries.
exceptions:
  - id: GO-2026-5158
    reason: "otel baggage header length (kubectl v1.34.13, otel v1.41.0): kubectl takes no baggage header from anyone but the cluster's API server, over TLS. Fixed in otel v1.42.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-5932
    reason: "x/crypto/openpgp, unmaintained (trivy 0.76.1, x/crypto v0.57.0; gitlab-runner and gitlab-runner-helper 19.5.3, our build, v0.58.0, #21): the job's trivy reads one image, the CI image, and no OpenPGP key or message from outside; the runner and the helper call no openpgp code. No fixed release (x/crypto has only a pseudo-version past it), as tacplus handles it."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04; the runner images: hub, tacplus-dev/cluster#21, 2026-11-12)"
    expires: 2026-12-04
  - id: GO-2026-6603
    reason: "x/net HTTP/2 server, Trailer headers (kubectl v1.34.13, x/net v0.56.0): kubectl runs no HTTP/2 server here (no kubectl proxy); it is a client of the cluster's API server only. Fixed in x/net v0.60.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6610
    reason: "x/net HTTP/2 transport, malformed framing headers (kubectl v1.34.13, x/net v0.56.0): kubectl's only peer is the cluster's API server, over TLS. Fixed in x/net v0.60.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6611
    reason: "x/net HTTP/2 transport, CPU on repeated window changes (kubectl v1.34.13, x/net v0.56.0): kubectl's only peer is the cluster's API server, over TLS. Fixed in x/net v0.60.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6612
    reason: "x/net HTTP/2 server streams, flow control refund (kubectl v1.34.13, x/net v0.56.0): kubectl runs no HTTP/2 server here. Fixed in x/net v0.60.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6617
    reason: "x/net HTTP/2 server, HPACK encoder race (kubectl v1.34.13, x/net v0.56.0): kubectl runs no HTTP/2 server here. Fixed in x/net v0.60.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6629
    reason: "x/text precis panic on crafted input (kubectl v1.34.13, x/text v0.39.0): kubectl's input is this repository's render and the cluster's API server. Fixed in x/text v0.41.0; no kubectl 1.34 release with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6860
    reason: "x/net/html quadratic text coalescing (kubectl v1.34.13 x/net v0.56.0, gke-gcloud-auth-plugin 0.5.21 v0.61.0, trivy 0.76.1 v0.60.0): none of them parses HTML from outside here; their peers are the cluster, Google's token endpoints and the image registries. Fixed in x/net v0.62.0; no release of the three with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6866
    reason: "x/net/html raw text rendering (kubectl v1.34.13, gke-gcloud-auth-plugin 0.5.21, trivy 0.76.1): none of them renders HTML here. Fixed in x/net v0.62.0; no release of the three with it yet."
    decided_by: "jodydadescott (tacplus-dev/cluster#5, 2026-11-04)"
    expires: 2026-12-04
  - id: GO-2026-6865
    reason: "klauspost/compress panic on two-block frames (trivy 0.76.1, compress v1.20.1; a release binary, not built here): the job's trivy decodes only the CI image's and the pinned images' layers, from their registries, and its own vulnerability database. Fixed in compress v1.20.2; no trivy release with it yet (0.76.2 still has v1.20.1)."
    decided_by: "jodydadescott (tacplus-dev/cluster#10, 2026-11-06)"
    expires: 2026-12-06
  - id: CVE-2026-78661
    reason: "x/net/html DoS on crafted HTML (the CI image's gh, build:2.6, x/net v0.60.0): no job here has gh parse HTML from outside. Fixed in v0.62.0; the CI image's gh waits for tacplus-dev/tacplus#350. (GitLab Runner's runner and helper are built with v0.62.0 since #21.)"
    decided_by: "jodydadescott (hub, tacplus-dev/cluster#15, 2026-11-07)"
    expires: 2026-12-06
  - id: CVE-2026-97054
    reason: "GO-2026-6859, an HTTP/1 server crash in net/http (gke-gcloud-auth-plugin 0.5.21, go1.27.3; kubectl v1.34.13, go1.26.10; fixed in go1.26.11 and go1.27.4): kubectl and its auth plugin serve no HTTP, and nothing untrusted reaches them; no kubectl 1.34 or plugin release has the fix yet. The tools built here, and GitLab Runner's runner and helper since #21, are built with go1.27.4 (ci/tools.sh, ci/runner-images.sh); the hub's interim for upstream's runner images ended with them."
    decided_by: "jodydadescott (hub, tacplus-dev/cluster#21, 2026-11-12; kubectl and its plugin as #5 decided their other findings: no release of the tool with the fix)"
    expires: 2026-11-25
  - id: CVE-2026-85091
    reason: "zlib heap buffer overflow in gz_vacate() (the CI image build:2.6.2's arm64 image, zlib1g and zlib1g-dev 1:1.3.dfsg+really1.3.1-1+b1, fixed in 1-1+deb13u1): no job here decompresses untrusted input; the jobs read this repository, the pinned tools and images by digest, and the cluster. No build:2.6.x arm64 image with the fix yet (tacplus-dev/tacplus#369)."
    decided_by: "jodydadescott (hub, tacplus-dev/cluster#16, 2026-11-07)"
    expires: 2026-12-06
  - id: CVE-2026-76844
    reason: "matched by Trivy's DB to zlib1g and zlib1g-dev 1:1.3.dfsg+really1.3.1-1+b1 (the CI image build:2.6.2's arm64 image, fixed in 1-1+deb13u1), though its title is a webpack-dev-middleware path traversal: no job here serves files with webpack, nor decompresses untrusted input. No build:2.6.x arm64 image with the fix yet (tacplus-dev/tacplus#369)."
    decided_by: "jodydadescott (hub, tacplus-dev/cluster#16, 2026-11-07)"
    expires: 2026-12-06
