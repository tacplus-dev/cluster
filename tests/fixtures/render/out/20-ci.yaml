        tacplus.dev/runner-token-secret: "gitlab-runner-build"
    spec:
      securityContext:
        fsGroup: 65533
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 3600
      serviceAccountName: "gitlab-runner-build"
      containers:
        - name: gitlab-runner-build
