        tacplus.dev/ci-runner: build-light
      annotations:
        checksum/configmap: d483bf01d85cd8de31e04b0ac35a964c079f69de5747dbae8e9585e141905a87
        tacplus.dev/runner-protected: "false"
        tacplus.dev/runner-tags: "arm64,build-light"
        tacplus.dev/runner-token: "projects/tacplus-dev/secrets/gitlab-runner-build-light/versions/1"
        tacplus.dev/runner-token-secret: "gitlab-runner-build-light"
    spec:
