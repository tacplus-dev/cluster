            nodeSelectorTerms:
              - matchExpressions:
                  - key: spot
                    operator: NotIn
                    values:
                      - "true"
                  - key: cloud.google.com/gke-spot
                    operator: NotIn
                    values:
                      - "true"
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
