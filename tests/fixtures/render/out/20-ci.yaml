              value: "true"
            - name: RUNNER_TAG_LIST
              value: ""
            - name: SESSION_SERVER_ADDRESS
              value:
          livenessProbe:
            exec:
              command: ["/bin/bash", "/configmaps/check-live", "3"]
            initialDelaySeconds: 60
            timeoutSeconds: 4
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/bin/pgrep", "gitlab.*runner"]
            initialDelaySeconds: 60
            timeoutSeconds: 4
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
          ports:
            - name: "metrics"
              containerPort: 9252
          volumeMounts:
            - name: projected-secrets
              mountPath: /secrets
            - name: etc-gitlab-runner
              mountPath: /home/gitlab-runner/.gitlab-runner
            - name: configmaps
              mountPath: /configmaps
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: runner-secrets
          emptyDir:
            medium: "Memory"
        - name: etc-gitlab-runner
          emptyDir:
            medium: "Memory"
        - name: projected-secrets
          projected:
            sources:
              - secret:
                  name: "gitlab-runner-build"
                  items:
                    - key: runner-registration-token
                      path: runner-registration-token
                    - key: runner-token
                      path: runner-token
        - name: configmaps
          configMap:
            name: gitlab-runner-build
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: spot
                    operator: NotIn
                    values:
                      - "true"
                  - key: cloud.google.com/gke-spot
                    operator: NotIn
                    values:
                      - "true"
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
