            - mountPath: /home/gitlab-runner
              name: home
            - mountPath: /tmp
              name: tmp
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: runner-secrets
