# CI in the cluster (README, CI in the cluster): the namespace ci, where GitLab Runner's Kubernetes executor runs
# every job as a pod. Rendered by render.sh; never edited.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    tacplus.dev/ci: "true"
---
# The jobs' pods' account: no role anywhere, and no token in the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-job
  namespace: ci
automountServiceAccountToken: false
---
# No pod in ci reaches the metadata server, so none gets the node's Google account, nor a Workload Identity one
# (169.254.169.252 is GKE's metadata server under Workload Identity). A job that needs Google Cloud federates its own
# GitLab id_token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-no-metadata-server
  namespace: ci
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 169.254.169.252/32]
        - namespaceSelector: {}
---
# Refused in ci, whatever creates the pod (the runners' account may create pods there): a privileged container, a
# host path, the host's network, PID or IPC namespace, a host port, an added capability.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ci-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) ||
        !c.securityContext.privileged)
      message: no privileged container in ci
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: no host path in ci
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: no host network, PID or IPC namespace in ci
    - expression: >-
        variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      message: no host port in ci
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: no added capability in ci
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ci-pods
spec:
  policyName: ci-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ci
---
# The runner build (gitlab-runner/runners/build.yaml), tags arm64, build: GitLab Runner's chart 0.94.3.
# Source: gitlab-runner/templates/service-account.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "gitlab-runner-build"
  namespace: "ci"
  labels:
    app: gitlab-runner-build
    chart: gitlab-runner-0.94.3
    release: "gitlab-runner-build"
    heritage: "Helm"
---
# Source: gitlab-runner/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-build
  namespace: "ci"
  labels:
    app: gitlab-runner-build
    chart: gitlab-runner-0.94.3
    release: "gitlab-runner-build"
    heritage: "Helm"
data:
  entrypoint: |
    #!/bin/bash
    set -e

    export CONFIG_PATH_FOR_INIT="/home/gitlab-runner/.gitlab-runner/"
    mkdir -p ${CONFIG_PATH_FOR_INIT}
    cp /configmaps/config.toml ${CONFIG_PATH_FOR_INIT}
    # Set up environment variables for cache
    if [[ -f /secrets/accesskey && -f /secrets/secretkey ]]; then
      export CACHE_S3_ACCESS_KEY=$(cat /secrets/accesskey)
      export CACHE_S3_SECRET_KEY=$(cat /secrets/secretkey)
    fi

    if [[ -f /secrets/gcs-applicaton-credentials-file ]]; then
      export GOOGLE_APPLICATION_CREDENTIALS="/secrets/gcs-applicaton-credentials-file"
    elif [[ -f /secrets/gcs-application-credentials-file ]]; then
      export GOOGLE_APPLICATION_CREDENTIALS="/secrets/gcs-application-credentials-file"
    else
      if [[ -f /secrets/gcs-access-id && -f /secrets/gcs-private-key ]]; then
        export CACHE_GCS_ACCESS_ID=$(cat /secrets/gcs-access-id)
        # echo -e used to make private key multiline (in google json auth key private key is oneline with \n)
        export CACHE_GCS_PRIVATE_KEY=$(echo -e $(cat /secrets/gcs-private-key))
      fi
    fi

    if [[ -f /secrets/azure-account-name && -f /secrets/azure-account-key ]]; then
      export CACHE_AZURE_ACCOUNT_NAME=$(cat /secrets/azure-account-name)
      export CACHE_AZURE_ACCOUNT_KEY=$(cat /secrets/azure-account-key)
    fi

    if [[ -f /secrets/runner-registration-token ]]; then
      export REGISTRATION_TOKEN=$(cat /secrets/runner-registration-token)
    fi

    if [[ -f /secrets/runner-token ]]; then
      export CI_SERVER_TOKEN=$(cat /secrets/runner-token)
    fi
    if ! sh /configmaps/register-the-runner; then
      exit 1
    fi

    # Run pre-entrypoint-script
    if ! bash /configmaps/pre-entrypoint-script; then
      exit 1
    fi

    # Start the runner
    exec /entrypoint run \
      --working-directory=/home/gitlab-runner
  config.toml: |
    shutdown_timeout = 0
    concurrent = 6
    check_interval = 3
    log_level = "info"
  config.template.toml: |
    [[runners]]
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "ci"
        image = "ghcr.io/tacplus-dev/tacplus/build:2.6.1@sha256:91f42995e0e3d6f959a7f75177caf94b2aded90fc36c8492dbcd320ca0d187f5"
        helper_image = "registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:v19.5.3@sha256:3e3f338637600789b42a97b0942a686e3b734a01181cd7bc74250ffa39b44810"
        service_account = "ci-job"
        automount_service_account_token = false
        privileged = false
        # A spot node from 0 takes minutes to come up.
        poll_timeout = 900
        cpu_request = "1"
        cpu_limit = "3"
        memory_request = "4Gi"
        memory_limit = "8Gi"
        cpu_request_overwrite_max_allowed = "3500m"
        cpu_limit_overwrite_max_allowed = "3500m"
        memory_request_overwrite_max_allowed = "12Gi"
        memory_limit_overwrite_max_allowed = "12Gi"
        helper_cpu_request = "100m"
        helper_cpu_limit = "1"
        helper_memory_request = "128Mi"
        helper_memory_limit = "512Mi"
        [runners.kubernetes.pod_labels]
          "tacplus.dev/ci-runner" = "build"
        [runners.kubernetes.node_selector]
          "kubernetes.io/arch" = "arm64"
          "spot" = "true"
        [runners.kubernetes.node_tolerations]
          "spot=true" = "NoSchedule"
          "kubernetes.io/arch=arm64" = "NoSchedule"
        [runners.kubernetes.pod_security_context]
          run_as_non_root = true
          run_as_user = 1000
          run_as_group = 1000
          fs_group = 1000
          [runners.kubernetes.pod_security_context.seccomp_profile]
            type = "RuntimeDefault"
        # Rootless BuildKit: user namespaces and mounts (unshare, mount) need these two unconfined; its
        # newuidmap is setuid, so privilege escalation stays allowed in this container. No capability is added.
        [runners.kubernetes.build_container_security_context]
          [runners.kubernetes.build_container_security_context.seccomp_profile]
            type = "Unconfined"
          [runners.kubernetes.build_container_security_context.app_armor_profile]
            type = "Unconfined"
        [runners.kubernetes.helper_container_security_context]
          allow_privilege_escalation = false
          [runners.kubernetes.helper_container_security_context.capabilities]
            drop = ["ALL"]
  register-the-runner: |
    #!/bin/sh
    signal_handler() {
      if [ ! -d "/proc/$register_pid" ]; then
        wait $register_pid
      fi
      exit
    }
    trap 'signal_handler' QUIT INT

    MAX_REGISTER_ATTEMPTS=30

    # Reset/unset the not needed flags when an authentication token
    RUN_UNTAGGED=""
    ACCESS_LEVEL=""

    if [ -n "$CI_SERVER_TOKEN" ] && [ "${CI_SERVER_TOKEN#glrt-}" != "$CI_SERVER_TOKEN" ]; then
      RUN_UNTAGGED=""
      ACCESS_LEVEL=""
      unset REGISTER_LOCKED
      unset RUNNER_TAG_LIST
    fi

    for i in $(seq 1 "${MAX_REGISTER_ATTEMPTS}"); do
      echo "Registration attempt ${i} of ${MAX_REGISTER_ATTEMPTS}"
      /entrypoint register \
        --name="tacplus-dev build (cluster, ci, spot pool)"\
        ${RUN_UNTAGGED} \
        ${ACCESS_LEVEL} \
        --template-config /configmaps/config.template.toml \
        --non-interactive &

      register_pid=$!
      wait $register_pid
      retval=$?

      if [ ${retval} = 0 ]; then
        break
      elif [ ${i} = ${MAX_REGISTER_ATTEMPTS} ]; then
        exit 1
      fi

      sleep 5
    done
  check-live: |
    #!/bin/bash
    set -eou pipefail

    # default timeout is 3 seconds, can be overriden
    VERIFY_TIMEOUT=${1:-${VERIFY_TIMEOUT:-3}}

    if ! /usr/bin/pgrep -f ".*register-the-runner"  > /dev/null && ! /usr/bin/pgrep -f "gitlab.*runner"  > /dev/null ; then
      exit 1
    fi

    status=0
    # empty --url= helps `gitlab-runner verify` select all configured runners (otherwise filters for $CI_SERVER_URL)
    verify_output=$(timeout "${VERIFY_TIMEOUT}" gitlab-runner verify --url= 2>&1) || status=$?

    # timeout exit code is 143 with busybox, and 124 with coreutils
    if (( status == 143 )) || (( status == 124 )) ; then
      echo "'gitlab-runner verify' terminated by timeout, not a conclusive failure" >&2
      exit 0
    elif (( status > 0 )) ; then
      exit ${status}
    fi

    grep -qE "is (alive|valid)" <<<"${verify_output}"
  pre-entrypoint-script: ""
